name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test-and-build:
    name: Test and build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build frontend
        run: npm run build:web

  windows-installer:
    name: Windows installer
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build Windows installer
        run: npm run build

      - name: Install and launch application
        shell: pwsh
        run: |
          $installer = Get-ChildItem release/Szeptucha-Setup-*.exe | Select-Object -First 1
          if (-not $installer) {
            throw "Windows installer was not created."
          }

          $installDir = Join-Path $env:RUNNER_TEMP "SzeptuchaSmoke"
          $install = Start-Process -FilePath $installer.FullName -ArgumentList @("/S", "/D=$installDir") -Wait -PassThru
          if ($install.ExitCode -ne 0) {
            throw "Installer exited with code $($install.ExitCode)."
          }

          $appPath = Join-Path $installDir "Szeptucha.exe"
          if (-not (Test-Path $appPath)) {
            throw "Installed application was not found at $appPath."
          }

          & .\node_modules\.bin\electron.cmd scripts/whisper-process-smoke.cjs (Join-Path $installDir "resources/app.asar")
          if ($LASTEXITCODE -ne 0) {
            throw "Whisper process cancellation smoke test failed."
          }

          $app = Start-Process -FilePath $appPath -ArgumentList "--remote-debugging-port=9223" -PassThru
          try {
            node scripts/windows-ui-smoke.cjs
            if ($LASTEXITCODE -ne 0) {
              throw "Renderer UI smoke test failed."
            }
            $app.Refresh()
            if ($app.HasExited) {
              throw "Application exited during the smoke test with code $($app.ExitCode)."
            }
          } finally {
            if (-not $app.HasExited) {
              Stop-Process -Id $app.Id -Force
            }
          }

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: szeptucha-windows-installer
          path: release/*.exe
          if-no-files-found: error
          retention-days: 7
